apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gustavocalce/fiap-fase3-tmm-iac.git
    targetRevision: main
    path: gitops/apps/analytics-service
  destination:
    server: https://kubernetes.default.svc
    namespace: analytics-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: keda.sh
      kind: ScaledObject
      jsonPointers:
        - /spec/triggers
        - /status
